backend:
  name: git-gateway
  branch: main

media_folder: "cuve-site/images"
public_folder: "/images"
editor:
  preview: false

collections:

  - name: "reels"
    label: "🎬 쇼릴 관리"
    files:
      - label: "쇼릴 목록"
        name: "reels"
        file: "cuve-site/data/reels.json"
        fields:
          - label: "쇼릴 목록"
            name: "reels"
            widget: "list"
            summary: "{{fields.year}}년 쇼릴"
            fields:
              - { label: "연도", name: "year", widget: "number", value_type: "int" }
              - { label: "유튜브 ID", name: "youtubeId", widget: "string" }

  - name: "works"
    label: "🎨 작품 관리"
    files:
      - label: "작품 목록"
        name: "works"
        file: "cuve-site/data/works.json"
        fields:
          - label: "작품 목록"
            name: "works"
            widget: "list"
            summary: "[{{fields.type}}] {{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int" }
              - { label: "작품 제목", name: "title", widget: "string" }
              - label: "타입"
                name: "type"
                widget: "select"
                default: "video"
                options:
                  - { label: "🎬 영상 (YouTube)", value: "video" }
                  - { label: "🖼 스틸컷 (이미지 업로드)", value: "still" }
              - label: "카테고리"
                name: "category"
                widget: "select"
                options:
                  - { label: "Media Arts", value: "Media Arts" }
                  - { label: "Commercial", value: "Commercial" }
                  - { label: "Animation", value: "Animation" }
                  - { label: "AR/VR/Interactive", value: "AR/VR/Interactive" }
                  - { label: "A.i", value: "A.i" }
                  - { label: "LiveAction", value: "LiveAction" }
                  - { label: "OAP Title", value: "OAP Title" }
              - { label: "제작 연도", name: "year", widget: "number", value_type: "int" }
              - { label: "유튜브 ID", name: "youtubeId", widget: "string", required: false, default: "" }
              - { label: "대표 썸네일", name: "thumbnail", widget: "image", required: false }
              - label: "스틸 이미지 목록"
                name: "images"
                widget: "list"
                required: false
                default: []
                field: { label: "이미지", name: "image", widget: "image" }
              - { label: "설명", name: "description", widget: "text", required: false, default: "" }
              - { label: "Client", name: "client", widget: "string", required: false, default: "—" }
              - { label: "Agency", name: "agency", widget: "string", required: false, default: "—" }
              - { label: "Production", name: "production", widget: "string", required: false, default: "CUVE" }
              - { label: "Director", name: "director", widget: "string", required: false, default: "—" }
              - { label: "Sound", name: "sound", widget: "string", required: false, default: "—" }

  - name: "apps"
    label: "📱 앱 관리"
    files:
      - label: "앱 목록"
        name: "apps"
        file: "cuve-site/data/apps.json"
        fields:
          - label: "앱 목록"
            name: "apps"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int" }
              - { label: "앱 이름", name: "title", widget: "string" }
              - { label: "한 줄 소개", name: "subtitle", widget: "string", required: false }
              - { label: "앱 아이콘", name: "icon", widget: "image", required: false }
              - label: "스크린샷"
                name: "screenshots"
                widget: "list"
                required: false
                field: { label: "스크린샷", name: "screenshot", widget: "image" }
              - { label: "앱 설명", name: "description", widget: "text", required: false }
              - { label: "카테고리", name: "category", widget: "string", required: false, default: "Creative Tools" }
              - label: "플랫폼"
                name: "platform"
                widget: "select"
                multiple: true
                options:
                  - { label: "Android", value: "android" }
                  - { label: "iOS", value: "ios" }
                  - { label: "Web", value: "web" }
              - label: "링크"
                name: "links"
                widget: "object"
                fields:
                  - { label: "Google Play URL", name: "playstore", widget: "string", required: false, default: "" }
                  - { label: "App Store URL", name: "appstore", widget: "string", required: false, default: "" }
                  - { label: "Website URL", name: "website", widget: "string", required: false, default: "" }
              - { label: "출시 연도", name: "year", widget: "number", value_type: "int", required: false }
